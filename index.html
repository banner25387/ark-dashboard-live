<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARK 全收集資料庫</title>
<style>
:root{--bg:#0e1420;--side:#0a0f18;--card:#18212f;--line:#26334a;--txt:#e8eef7;--dim:#8fa1ba;
--acc:#4fd1a5;--warn:#f0b054;--bad:#e06c75;--bar:#223049}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Microsoft JhengHei",sans-serif}
.layout{display:flex;min-height:100vh}
aside{width:216px;flex:none;background:var(--side);border-right:1px solid var(--line);
padding:16px 10px;position:sticky;top:0;height:100vh}
.brand{font-size:15px;font-weight:700;padding:6px 10px 14px}
nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
color:var(--dim);font-size:14px;cursor:pointer;text-decoration:none;margin-bottom:2px}
nav a:hover{background:#131c2b;color:var(--txt)}
nav a.active{background:#1a2536;color:var(--txt);font-weight:600}
nav a .n{margin-left:auto;font-size:12px;color:var(--dim)}
.side-sub{color:var(--dim);font-size:11px;padding:14px 10px;line-height:1.6}
main{flex:1;padding:18px;min-width:0}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.layout{flex-direction:column}aside{width:100%;height:auto;position:static}
.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.wide{grid-column:1/-1}
.card.two{grid-column:span 2}
@media(max-width:1100px){.card.two{grid-column:1/-1}}
.card h2{font-size:14px;color:var(--dim);font-weight:600;margin-bottom:10px}
.big{font-size:34px;font-weight:700}
.big small{font-size:15px;color:var(--dim);font-weight:400}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.maprow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.maprow:last-child{border-bottom:0}
.maprow .nm{flex:0 0 220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maprow .bar{flex:1;margin:0}
.maprow .ct{flex:0 0 76px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:12px 0}
.tag{font-size:10px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.tag.now{background:#1d4a3c;color:var(--acc)}
.tag.ex{background:#4a3a1d;color:var(--warn)}
ul{list-style:none;font-size:13px}
ul li{padding:4px 0;border-bottom:1px solid var(--line);color:var(--dim)}
ul li b{color:var(--txt);font-weight:600}
ul li:last-child{border-bottom:0}
.warn{color:var(--warn)} .muted{color:var(--dim);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;flex:none}
.chk .done{text-decoration:line-through;color:var(--dim)}
.chk .note{color:var(--dim);font-size:11px;margin-left:auto;text-align:right}
.chk input.coord{margin-left:auto;width:110px;background:var(--bar);border:1px solid var(--line);
border-radius:6px;color:var(--txt);font-size:12px;padding:3px 6px}
.grp{color:var(--dim);font-size:12px;font-weight:600;margin:8px 0 2px}
.bigbtn{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;
min-height:120px;cursor:pointer;transition:border-color .15s}
.bigbtn:hover{border-color:var(--acc)}
.bigbtn .num{font-size:36px;font-weight:700;color:var(--acc)}
.bigbtn .lbl{font-size:14px;color:var(--dim)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbar input,.fbar select{background:var(--bar);border:1px solid var(--line);border-radius:8px;
color:var(--txt);font-size:13px;padding:6px 10px}
.fbar input{flex:1;min-width:160px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--dim);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:#1d2838}
.tbl a{color:var(--acc);text-decoration:none}
.cnt{color:var(--dim);font-size:12px;margin-left:8px;font-weight:400}
.page[hidden]{display:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
@media(max-width:760px){.cols2{grid-template-columns:1fr}}
.mapbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mapbar select{background:var(--card);border:1px solid var(--line);border-radius:8px;
color:var(--txt);font-size:14px;padding:7px 10px;min-width:200px}
.mapbar button{background:var(--card);border:1px solid var(--line);border-radius:8px;
color:var(--dim);font-size:13px;padding:7px 12px;cursor:pointer}
.mapbar button:hover{border-color:var(--acc);color:var(--txt)}
.mapbar .cur{color:var(--acc);font-size:12px}
.rm{background:none;border:0;color:var(--dim);cursor:pointer;font-size:12px;padding:0 2px;flex:none;margin-left:auto}
.rm:hover{color:var(--bad)}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;background:var(--bar);border:1px solid var(--line);border-radius:6px;
color:var(--txt);font-size:12px;padding:4px 8px;min-width:0}
.addrow button{background:var(--bar);border:1px solid var(--line);border-radius:6px;
color:var(--dim);font-size:12px;padding:4px 10px;cursor:pointer}
.addrow button:hover{border-color:var(--acc);color:var(--txt)}
/* 唯讀展示模式：勾選狀態照常顯示，但鎖住互動、藏掉編輯元件 */
body.ro .chk input,body.ro input.coord{pointer-events:none}
body.ro .rm,body.ro .addrow,body.ro #btn-cur{display:none}
body.ro .chk{cursor:default}
</style></head><body>
<div class="layout">
<aside>
  <div class="brand">🦖 ARK 全收集資料庫</div>
  <nav id="nav">
    <a data-p="home" class="active">🏠 首頁</a>
    <a data-p="tames">🧾 馴服列表 <span class="n" id="nav-t"></span></a>
    <a data-p="stats">📊 物種統計 <span class="n" id="nav-s"></span></a>
    <a data-p="eps">🎬 直播集數 <span class="n" id="nav-e"></span></a>
  </nav>
  <div class="side-sub" id="side-sub"></div>
</aside>
<main>
  <div class="page" id="page-home">
    <h1>🦖 ARK 全收集儀表板</h1>
    <div class="sub" id="sub">載入中…</div>
    <div class="mapbar">
      <select id="map-sel"></select>
      <button id="btn-cur">📍 設為目前所在</button>
      <span class="cur" id="cur-hint"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="page" id="page-tames" hidden>
    <h1>🧾 馴服列表 <span class="cnt" id="tcnt"></span></h1>
    <div class="sub">物種顯示：英文（日文）｜資料來源 data/馴服紀錄.csv</div>
    <div class="card wide">
      <div class="fbar">
        <input id="f-tq" placeholder="搜尋物種/暱稱/備註…">
        <select id="f-tmap"><option value="">全部地圖</option></select>
        <select id="f-tst"><option value="">全部狀態</option></select>
      </div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr>
        <th>日期</th><th>物種</th><th>地圖</th><th>集數</th><th>暱稱</th><th>性別</th><th>等級</th><th>狀態</th><th>備註</th>
      </tr></thead><tbody id="tbody-t"></tbody></table></div>
    </div>
  </div>
  <div class="page" id="page-stats" hidden>
    <h1>📊 物種統計 <span class="cnt" id="scnt"></span></h1>
    <div class="sub">現存＝馴服紀錄存活列｜累計＝部落日誌總檔（只增不刪；入手＝馴服＋孵化、粉碎＝Bio-Grinder）</div>
    <div class="card wide">
      <div class="fbar">
        <input id="f-sq" placeholder="搜尋物種…">
      </div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr>
        <th>物種</th><th>現存</th><th>公</th><th>母</th><th>冷凍中</th><th>累計入手</th><th>累計死亡</th><th>累計粉碎</th>
      </tr></thead><tbody id="tbody-s"></tbody></table></div>
    </div>
  </div>
  <div class="page" id="page-eps" hidden>
    <h1>🎬 直播集數 <span class="cnt" id="ecnt"></span></h1>
    <div class="sub">標題點擊開 VOD｜資料來源 data/直播集數.csv</div>
    <div class="card wide">
      <div class="fbar">
        <input id="f-eq" placeholder="搜尋標題/重點/備註…">
        <select id="f-emap"><option value="">全部地圖</option></select>
      </div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr>
        <th>集數</th><th>日期</th><th>地圖</th><th>標題</th><th>當集重點</th><th>備註</th>
      </tr></thead><tbody id="tbody-e"></tbody></table></div>
    </div>
  </div>
</main>
</div>

<script>
let R=null, F={tq:'',tmap:'',tst:'',eq:'',emap:'',sq:''};
let selMap=localStorage.getItem('ark_sel_map')||'';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function bar(p){return `<div class="bar"><i style="width:${p}%"></i></div>`}
function dn(s){const n=(R&&R.names||{})[s];return n?esc(s)+'（'+esc(n)+'）':esc(s)}
async function post(url,obj){await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)})}

// ---- 分頁路由 ----
function nav(p){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===p));
  document.querySelectorAll('.page').forEach(pg=>pg.hidden = pg.id!=='page-'+p);
  location.hash = p==='home' ? '' : p;
}
document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',()=>nav(a.dataset.p)));

// ---- 表格 ----
function tameRows(){
  return (R.tames_all||[]).filter(t=>{
    if(F.tmap && (t['地圖']||'')!==F.tmap) return false;
    if(F.tst && (t['狀態']||'')!==F.tst) return false;
    if(F.tq){const q=F.tq.toLowerCase();
      const nm=((R.names||{})[t['物種']]||'');
      if(![t['物種'],nm,t['暱稱'],t['備註'],t['集數']].join(' ').toLowerCase().includes(q)) return false;}
    return true;});
}
function epRows(){
  return (R.episodes_all||[]).filter(e=>{
    if(F.emap && (e['地圖']||'')!==F.emap) return false;
    if(F.eq){const q=F.eq.toLowerCase();
      if(![e['標題'],e['當集重點'],e['備註'],e['集數']].join(' ').toLowerCase().includes(q)) return false;}
    return true;});
}
function fillSelect(id, values){
  const el=document.getElementById(id), keep=el.value;
  el.innerHTML = el.options[0].outerHTML + values.map(v=>`<option>${esc(v)}</option>`).join('');
  el.value = keep;
}
function renderTameTable(){
  const rows=tameRows().map(t=>`<tr><td>${esc(t['日期'])}</td><td><b>${dn(t['物種'])}</b></td>
    <td>${esc(t['地圖'])}</td><td>${esc(t['集數'])}</td><td>${esc(t['暱稱'])}</td>
    <td>${esc(t['性別'])}</td><td>${esc(t['馴服後等級']||t['馴服等級'])}</td>
    <td>${esc(t['狀態'])}</td><td class="muted">${esc(t['備註'])}</td></tr>`).join('');
  document.getElementById('tbody-t').innerHTML=rows||'<tr><td colspan="9" class="muted">沒有符合的紀錄</td></tr>';
  document.getElementById('tcnt').textContent=`${tameRows().length} / ${(R.tames_all||[]).length} 筆`;
}
function statRows(){
  return (R.species_stats||[]).filter(s=>{
    if(F.sq){const q=F.sq.toLowerCase();
      const nm=((R.names||{})[s.sp]||'');
      if(!(s.sp+' '+nm).toLowerCase().includes(q)) return false;}
    return true;});
}
function renderStatTable(){
  const rows=statRows().map(s=>{
    const nm=s.mapped?dn(s.sp):esc(s.sp)+' <span class="tag ex">未對照</span>';
    return `<tr><td><b>${nm}</b></td><td>${s.alive||''}</td><td>${s.male||''}</td>
      <td>${s.female||''}</td><td>${s.frozen||''}</td>
      <td>${s.log_tamed||''}</td><td>${s.log_dead||''}</td><td>${s.log_ground||''}</td></tr>`;}).join('');
  document.getElementById('tbody-s').innerHTML=rows||'<tr><td colspan="8" class="muted">尚無資料</td></tr>';
  const tot=statRows().reduce((a,s)=>a+s.alive,0);
  document.getElementById('scnt').textContent=`${statRows().length} 物種｜現存 ${tot} 隻`;
}
function renderEpTable(){
  const rows=epRows().map(e=>{
    const t=e['VOD連結']?`<a href="${esc(e['VOD連結'])}" target="_blank">${esc(e['標題']||'(無標題)')}</a>`:esc(e['標題']);
    return `<tr><td>#${esc(e['集數'])}</td><td>${esc(e['日期'])}</td><td>${esc(e['地圖'])}</td>
      <td>${t}</td><td>${esc(e['當集重點'])}</td><td class="muted">${esc(e['備註'])}</td></tr>`;}).join('');
  document.getElementById('tbody-e').innerHTML=rows||'<tr><td colspan="6" class="muted">沒有符合的紀錄</td></tr>';
  document.getElementById('ecnt').textContent=`${epRows().length} / ${(R.episodes_all||[]).length} 集`;
}

// ---- 首頁 ----
function renderHome(){
  const r=R;
  document.getElementById('sub').textContent =
    `目前所在：${r.current_location||'未設定'}｜進行中：${r.current_maps.join('、')||'無'}`
    +(r.snapshot_at?`｜快照時間 ${r.snapshot_at}`:'｜30 秒自動更新')
    +(r.readonly?'｜👁 唯讀展示版':'');
  document.getElementById('side-sub').textContent =
    `圖鑑 ${r.tamed_count}/${r.total_tameable}（${r.global_pct}%）`;
  document.getElementById('nav-t').textContent=(r.tames_all||[]).length;
  document.getElementById('nav-s').textContent=(r.species_stats||[]).length;
  document.getElementById('nav-e').textContent=(r.episodes_all||[]).length;
  let cards=[];

  // ① 圖鑑進度
  const mrows=r.per_map.map(m=>{
    const now=m.status==='進行中'?'<span class="tag now">進行中</span>':'';
    const ex=m.exclusive_remaining.length?`<span class="tag ex">獨有-${m.exclusive_remaining.length}</span>`:'';
    return `<div class="maprow"><span class="nm" title="${esc(m.map)}">${esc(m.map)}${now}${ex}</span>
      ${bar(m.pct)}<span class="ct">${m.done}/${m.available}</span></div>`;}).join('');
  cards.push(`<div class="card"><h2>圖鑑進度（每物種一次）</h2>
    <div class="big">${r.tamed_count} <small>/ ${r.total_tameable}（${r.global_pct}%）</small></div>
    ${bar(r.global_pct)}
    <div class="muted">已推出地圖可取得 ${r.obtainable_total} 種（${r.obtainable_pct}%）｜
    ${r.not_yet_obtainable.length} 種等未來地圖｜不可馴服另計 ${r.untameable_count} 種</div>
    <div class="sep"></div>${mrows}</div>`);

  // 地圖選擇器（預設＝目前所在地圖；切換記在瀏覽器 localStorage）
  const mapOpts=r.per_map.map(m=>m.map);
  if(!mapOpts.includes(selMap)) selMap=r.current_location||(r.current_maps||[])[0]||mapOpts[0]||'';
  const selEl=document.getElementById('map-sel');
  if(document.activeElement!==selEl)  // 下拉展開中不重建，避免自動更新把選單關掉
    selEl.innerHTML=mapOpts.map(m=>
      `<option value="${esc(m)}" ${m===selMap?'selected':''}>${esc(m)}${m===r.current_location?'（目前所在）':''}</option>`).join('');
  document.getElementById('cur-hint').textContent = selMap===r.current_location?'✔ 目前所在地圖':'';
  const mp=selMap;

  // ② 所選地圖攻略清單（寬卡雙欄：左＝據點/洞窟/Boss、右＝預計抓生物）
  if(mp){
    const items=(r.checklist||{})[mp]||[];
    let left;
    if(!items.length){left='<div class="muted">此圖尚無清單資料</div>';}
    else{
      const groups={};items.forEach(it=>{(groups[it['類型']]=groups[it['類型']]||[]).push(it)});
      left=Object.entries(groups).map(([g,arr])=>{
        const done=arr.filter(x=>x['完成']==='是').length;
        return `<div class="grp">${esc(g)}（${done}/${arr.length}）</div>`+arr.map(it=>{
          const coordBox = g==='據點'
            ? `<input class="coord" placeholder="座標 如34.3/51.4" value="${esc(it['座標']||'')}"
               data-m="${esc(mp)}" data-t="${esc(g)}" data-n="${esc(it['名稱'])}">`
            : `<span class="note">${esc(it['座標']||(it['備註']||'').split(';')[0])}</span>`;
          return `<label class="chk"><input type="checkbox" data-kind="check" data-m="${esc(mp)}"
            data-t="${esc(g)}" data-n="${esc(it['名稱'])}" ${it['完成']==='是'?'checked':''}>
            <span class="${it['完成']==='是'?'done':''}">${esc(it['名稱'])}</span>${coordBox}</label>`;
        }).join('');}).join('');
    }
    const plans=(r.planned||{})[mp]||[];
    const pdone=plans.filter(x=>x.done).length;
    const pg={};plans.forEach(x=>{(pg[x.group]=pg[x.group]||[]).push(x)});
    const plist=Object.entries(pg).map(([g,arr])=>{
      const d=arr.filter(x=>x.done).length;
      return `<div class="grp">${esc(g)}（${d}/${arr.length}）</div>`+arr.map(x=>
        `<label class="chk"><input type="checkbox" data-kind="tame" data-m="${esc(mp)}"
          data-n="${esc(x.sp)}" ${x.done?'checked':''}>
         <span class="${x.done?'done':''}" title="${esc(x.note)}">${dn(x.sp)}</span>
         <button class="rm" data-kind="plan-rm" data-m="${esc(mp)}" data-n="${esc(x.sp)}"
          title="從清單移除（不動馴服紀錄）">✕</button></label>`).join('');
    }).join('');
    const right=`<div class="grp">🎯 預計抓生物（${pdone}/${plans.length}）</div>`
      +(plans.length?plist:'<div class="muted">尚無預計抓的生物——用下方輸入新增</div>')
      +`<div class="addrow"><input id="plan-new" placeholder="新增物種（英文名，對齊生物清單）">
        <button id="plan-add">＋ 加入</button></div>`;
    cards.push(`<div class="card two"><h2>📋 ${esc(mp)} 攻略清單</h2>
      <div class="cols2"><div>${left}</div><div>${right}</div></div></div>`);
  }

  // ③ 所選地圖獨有恐龍（獨有＝一定要抓；預計抓＝含共有物種，兩者概念不同）
  const pm=r.per_map.find(x=>x.map===mp);
  if(pm){
    const lst=pm.exclusive_list||[];
    const done=lst.filter(x=>x.done).length;
    const inner=lst.length?lst.map(x=>
      `<label class="chk"><input type="checkbox" data-kind="tame" data-m="${esc(mp)}"
        data-n="${esc(x.sp)}" ${x.done?'checked':''}>
       <span class="${x.done?'done':''}">${dn(x.sp)}</span></label>`).join('')
      :'<div class="muted">此圖沒有獨有物種（或資料未建）</div>';
    cards.push(`<div class="card"><h2>🦖 ${esc(mp)} 獨有恐龍（${done}/${lst.length}）</h2>${inner}</div>`);
  }

  // ④ 據點清單
  const brows=(r.bases||[]).map(b=>
    `<li><b>${esc(b['名稱'])}</b>｜${esc(b['地圖'])}｜${esc(b['座標'])}
     ｜${esc(b['用途'])}${b['狀態']?'｜'+esc(b['狀態']):''}</li>`).join('');
  cards.push(`<div class="card"><h2>🏠 據點清單</h2><ul>${brows||'<li>尚無據點——在攻略清單勾「建立主要據點」並填座標即自動登錄</li>'}</ul></div>`);

  // ⑤ 兩顆大按鍵（TOWASAMA 式入口）
  cards.push(`<div class="card bigbtn" onclick="nav('tames')">
    <div class="num">${(r.tames_all||[]).length}</div><div class="lbl">🧾 馴服列表 →</div></div>`);
  cards.push(`<div class="card bigbtn" onclick="nav('stats')">
    <div class="num">${(r.species_stats||[]).reduce((a,s)=>a+s.alive,0)}</div><div class="lbl">📊 物種統計（現存隻數）→</div></div>`);
  cards.push(`<div class="card bigbtn" onclick="nav('eps')">
    <div class="num">${(r.episodes_all||[]).length}</div><div class="lbl">🎬 直播集數 →</div></div>`);

  if(r.unknown_species.length)
    cards.push(`<div class="card wide"><h2 class="warn">⚠ 對不上生物清單的紀錄</h2>
      <ul><li>${r.unknown_species.map(esc).join('、')}</li></ul></div>`);

  document.getElementById('grid').innerHTML=cards.join('');

  // 事件綁定（首頁互動元件）
  document.querySelectorAll('input[data-kind=check]').forEach(cb=>cb.addEventListener('change',async()=>{
    await post('/api/check',{map:cb.dataset.m,type:cb.dataset.t,name:cb.dataset.n,done:cb.checked}); refresh();}));
  document.querySelectorAll('input[data-kind=tame]').forEach(cb=>cb.addEventListener('change',async()=>{
    await post('/api/tame',{species:cb.dataset.n,map:cb.dataset.m,done:cb.checked}); refresh();}));
  document.querySelectorAll('input.coord').forEach(inp=>inp.addEventListener('change',async()=>{
    await post('/api/coord',{map:inp.dataset.m,type:inp.dataset.t,name:inp.dataset.n,coord:inp.value}); refresh();}));
  document.querySelectorAll('button[data-kind=plan-rm]').forEach(b=>b.addEventListener('click',async e=>{
    e.preventDefault(); e.stopPropagation();
    await post('/api/plan-remove',{map:b.dataset.m,species:b.dataset.n}); refresh();}));
  const pa=document.getElementById('plan-add'), pn=document.getElementById('plan-new');
  if(pa&&pn){
    const submit=async()=>{const v=pn.value.trim(); if(!v) return;
      await post('/api/plan-add',{map:selMap,species:v}); pn.value=''; refresh();};
    pa.addEventListener('click',submit);
    pn.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  }
}

async function refresh(){
  // 靜態快照版：資料直接內嵌在頁面裡（export_static.py 產生），不打 API
  R = window.__ARK_DATA__ || await (await fetch('/api/data')).json();
  document.body.classList.toggle('ro', !!R.readonly);
  fillSelect('f-tmap',[...new Set((R.tames_all||[]).map(t=>t['地圖']).filter(Boolean))]);
  fillSelect('f-tst',[...new Set((R.tames_all||[]).map(t=>t['狀態']).filter(Boolean))]);
  fillSelect('f-emap',[...new Set((R.episodes_all||[]).map(e=>e['地圖']).filter(Boolean))]);
  const el=document.activeElement;
  const typing = el && el.tagName==='INPUT' && el.type==='text' && el.closest('#page-home');
  if(!typing) renderHome();
  renderTameTable(); renderStatTable(); renderEpTable();
}
const bind=(id,key,fn)=>{const el=document.getElementById(id);
  el.addEventListener('input',()=>{F[key]=el.value;fn();});};
bind('f-tq','tq',renderTameTable); bind('f-tmap','tmap',renderTameTable); bind('f-tst','tst',renderTameTable);
bind('f-eq','eq',renderEpTable);   bind('f-emap','emap',renderEpTable);
bind('f-sq','sq',renderStatTable);
document.getElementById('map-sel').addEventListener('change',e=>{
  selMap=e.target.value; localStorage.setItem('ark_sel_map',selMap); renderHome();});
document.getElementById('btn-cur').addEventListener('click',async()=>{
  await post('/api/current',{map:selMap}); refresh();});
nav(location.hash.replace('#','')||'home');
refresh(); setInterval(refresh, 30000);
</script></body></html>
